<form (submit)="onSubmit($event)">
  <div>
    <label>
      E-Mail
    </label>
    <input type="email" [formField]="loginForm.email" />
  </div>
  <div>
    <label>
      Password
    </label>
    <input type="password" [formField]="loginForm.password" />
  </div>
  <div>
    <button type="submit">Submit</button>
    <button type="button" (click)="onCancel()">Cancel</button>
  </div>
</form>
