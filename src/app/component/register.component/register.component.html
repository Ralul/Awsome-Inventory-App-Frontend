<form (submit)="onSubmit($event)">
  <div>
    <label for="username"> Username </label>
    <input id="username" type="text" [formField]="registerForm.username" />
  </div>
  <div>
    <label for="email"> E-Mail </label>
    <input id="email" type="email" [formField]="registerForm.email" />
  </div>
  <div>
    <label for="password"> Password </label>
    <input id="password" type="password" [formField]="registerForm.password" />
  </div>
  <div>
    <label for="confirmPassword"> Confirm Password </label>
    <input id="confirmPassword" type="password" [formField]="registerForm.passwordConfirmation" />
  </div>
  <div>
    <button type="submit">Submit</button>
    <button type="button" (click)="cancel()">Submit</button>
  </div>
</form>
